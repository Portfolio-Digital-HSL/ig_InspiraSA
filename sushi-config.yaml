# Configuração do SUSHI para o IG InspiraSA (Sumário de Alta).
# Referência das propriedades: https://fshschool.org/docs/sushi/configuration/
id: br.org.hsl.inspirasa
canonical: http://fhir.hsl.org.br/ig/inspirasa
name: InspiraSA
title: Guia de Implementação InspiraSA - Sumário de Alta
description: Guia de Implementação FHIR R4 do Sumário de Alta hospitalar. Usa os perfis do BR-Core 1.3.0 (br-core-sumarioalta e perfis das seções), sem perfis próprios, e substitui o SA-IG legado da RNDS, documentando os débitos técnicos entre o SA-IG, o BR-Core e o FHIR R4.
status: draft # draft | active | retired | unknown
version: 0.1.0
fhirVersion: 4.0.1 # https://www.hl7.org/fhir/valueset-FHIR-version.html
copyrightYear: 2026+
releaseLabel: ci-build
language: pt-BR
jurisdiction: urn:iso:std:iso:3166#BR "Brazil" # https://www.hl7.org/fhir/valueset-jurisdiction.html
publisher:
  name: Hospital Sírio-Libanês
  url: https://www.hospitalsiriolibanes.org.br

# BR-Core 1.3.0. A uri é a do ImplementationGuide publicado no pacote; sem ela o
# IG Publisher monta uma uri a partir do canonical e acusa dependsOn inválido.
dependencies:
  br.gov.saude.br-core.fhir:
    id: brcore
    uri: https://br-core.saude.gov.br/fhir/ImplementationGuide/br.gov.saude.br-core.fhir
    version: 1.3.0
  # FHIR Clinical Documents (HL7 internacional): perfis de Bundle e Composition
  # de documento clínico, usados onde o BR-Core não tem perfil.
  hl7.fhir.uv.fhir-clinical-document:
    id: clindoc
    uri: http://hl7.org/fhir/uv/fhir-clinical-document/ImplementationGuide/hl7.fhir.uv.fhir-clinical-document
    version: 1.0.1

# Não habilite i18n-default-lang sem testar: liga a geração multi-idioma
# (output/en + output/pt-BR) e introduz avisos de <script> e links quebrados.

pages:
  index.md:
    title: Início
  estrutura.md:
    title: Estrutura do documento
  terminologia.md:
    title: Terminologia
  mapeamento-sa.md:
    title: Mapeamento SA-IG
  comparativos.md:
    title: Comparativos
  debitos-tecnicos.md:
    title: Débitos técnicos
  recomendacoes-rnds.md:
    title: Recomendações à RNDS
  transicao.md:
    title: Transição e convivência

menu:
  Início: index.html
  Documento:
    Estrutura do documento: estrutura.html
    Terminologia: terminologia.html
  Análise:
    Mapeamento SA-IG: mapeamento-sa.html
    Comparativos: comparativos.html
  Débitos:
    Débitos técnicos: debitos-tecnicos.html
    Recomendações à RNDS: recomendacoes-rnds.html
    Transição: transicao.html
  Artefatos: artifacts.html

instanceOptions:
  manualSliceOrdering: true # true | false
